<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TestTrack</title>
<style>
:root{
  --blue:#2563eb;--blue-h:#1d4ed8;--blue-l:#eff6ff;
  --green:#16a34a;--green-l:#f0fdf4;
  --red:#dc2626;--red-l:#fef2f2;
  --amber:#d97706;--purple:#7c3aed;--cyan:#0891b2;
  --bg:#f0f4f8;--surface:#ffffff;
  --border:#e2e8f0;--border-h:#cbd5e1;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --navy:#1a2535;--navy2:#22304a;--navy3:#2d3f57;
  --r:8px;--r-sm:6px;--r-lg:14px;
  --sh-sm:0 1px 4px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh:0 4px 16px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.04);
  --sh-lg:0 12px 48px rgba(0,0,0,.14),0 4px 16px rgba(0,0,0,.06);
  --topbar:58px;--tabbar:44px;--sidebar:272px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;background:var(--bg);min-height:100vh;color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit;transition:all .15s ease}
pre{font-family:'SF Mono',Consolas,'Courier New',monospace}
select{cursor:pointer;font-family:inherit}
/* ── Topbar ── */
.topbar{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:0 28px;display:flex;align-items:center;gap:16px;height:var(--topbar);box-shadow:0 2px 16px rgba(0,0,0,.2)}
.logo{font-weight:800;font-size:18px;color:#60c9f8;letter-spacing:.3px;white-space:nowrap}
/* ── Tabs ── */
.tabs{background:var(--navy2);display:flex;padding:0 12px;height:var(--tabbar);align-items:flex-end;gap:3px}
.tab{background:transparent;color:rgba(255,255,255,.42);border:none;padding:8px 22px;font-size:13px;font-weight:500;border-radius:var(--r) var(--r) 0 0;transition:all .18s}
.tab:hover:not(.active){background:rgba(255,255,255,.07);color:rgba(255,255,255,.8)}
.tab.active{background:var(--bg);color:var(--navy);font-weight:700}
/* ── Sidebar ── */
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);padding:14px 0;min-height:calc(100vh - var(--topbar) - var(--tabbar));flex-shrink:0}
.suite-item{padding:10px 16px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:10px;transition:background .12s}
.suite-item.active{background:#eff6ff;border-left-color:var(--blue)}
.suite-item:hover:not(.active){background:#f8fafc}
.suite-item-actions{display:flex;gap:1px;opacity:0;transition:opacity .15s;flex-shrink:0}
.suite-item:hover .suite-item-actions,.suite-item.active .suite-item-actions{opacity:1}
.suite-icon-btn{background:none;border:none;font-size:12px;padding:3px 5px;border-radius:4px;color:var(--text3);line-height:1}
.suite-icon-btn:hover{background:var(--border);color:var(--text)}
/* ── Main ── */
.main{flex:1;padding:24px;min-width:0;overflow:auto}
/* ── Buttons ── */
.btn{border:none;border-radius:var(--r-sm);padding:8px 16px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 1px 3px rgba(37,99,235,.25)}
.btn-primary:hover{background:var(--blue-h);box-shadow:0 4px 12px rgba(37,99,235,.4);transform:translateY(-1px)}
.btn-primary:active{transform:translateY(0)}
.btn-success{background:var(--surface);color:var(--green);border:1.5px solid #86efac}
.btn-success:hover{background:var(--green-l);border-color:var(--green)}
.btn-info{background:var(--surface);color:var(--blue);border:1.5px solid #93c5fd}
.btn-info:hover{background:var(--blue-l);border-color:var(--blue)}
.btn-secondary{background:var(--surface);color:var(--text2);border:1.5px solid var(--border)}
.btn-secondary:hover{background:#f8fafc;border-color:var(--border-h);color:var(--text)}
.btn-danger{background:var(--red-l);color:var(--red);border:none}
.btn-danger:hover{background:#fee2e2}
.btn-sm{padding:4px 10px;font-size:11.5px;border-radius:4px}
/* ── Save button ── */
#save-btn{display:flex;align-items:center;gap:7px;border:none;border-radius:var(--r);padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
#save-btn.idle{background:rgba(255,255,255,.07);color:rgba(255,255,255,.3);cursor:default}
#save-btn.dirty{background:var(--amber);color:#fff;box-shadow:0 0 0 3px rgba(217,119,6,.3);animation:savepulse 1.8s infinite}
#save-btn.saving{background:#3b82f6;color:#fff;cursor:wait}
#save-btn.saved{background:var(--green);color:#fff}
#save-btn.error{background:var(--red);color:#fff}
@keyframes savepulse{0%,100%{box-shadow:0 0 0 3px rgba(217,119,6,.3)}50%{box-shadow:0 0 0 7px rgba(217,119,6,.08)}}
/* ── Table ── */
table{width:100%;border-collapse:collapse}
th{padding:11px 12px;text-align:left;font-size:10.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.7px;background:#f8fafc;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:13px;vertical-align:middle}
tr.even td{background:var(--surface)}
tr.odd td{background:#fafbfd}
tr.sel-row td{background:#eff6ff!important}
tr:hover td{background:#f0f7ff}
/* ── Badges ── */
.badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;display:inline-block}
.chip{padding:3px 9px;border-radius:4px;font-size:11px;font-weight:500;display:inline-block}
/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:998;padding:20px;animation:fadeIn .2s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:32px;box-shadow:var(--sh-lg);max-height:92vh;overflow-y:auto;width:100%;max-width:580px}
/* ── Forms ── */
.form-label{font-size:12px;font-weight:600;color:var(--text2);display:block;margin-bottom:5px}
.form-input{width:100%;border:1.5px solid var(--border);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;font-family:inherit;color:var(--text);transition:border-color .15s,box-shadow .15s;background:var(--surface)}
.form-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-input:hover:not(:focus){border-color:var(--border-h)}
textarea.form-input{line-height:1.6}
/* ── Progress ── */
.progress-bar{background:#e2e8f0;border-radius:10px;height:7px;overflow:hidden}
.progress-fill{height:100%;transition:width .4s cubic-bezier(.4,0,.2,1);border-radius:10px}
/* ── Hint ── */
.hint{background:#fefce8;border:1px solid #fde68a;border-radius:var(--r);padding:9px 14px;font-size:12px;color:#78350f;margin-bottom:14px;display:flex;align-items:center;gap:8px}
/* ── Bulk bar ── */
.bulk-bar{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:12px 20px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 40px rgba(0,0,0,.3);z-index:200;flex-wrap:wrap;border:1px solid var(--navy3)}
/* ── Spinner ── */
.spinner{display:inline-block;width:40px;height:40px;border:3px solid rgba(96,201,248,.2);border-top-color:#60c9f8;border-radius:50%;animation:spin .75s linear infinite}
/* ── Mode buttons ── */
.mode-btn{flex:1;padding:13px 8px;border:2px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--surface);color:var(--text2);font-size:12px;text-align:center;transition:all .15s;font-weight:500}
.mode-btn:hover{border-color:#93c5fd;background:var(--blue-l);color:var(--blue)}
.mode-btn.active{border-color:var(--blue);background:var(--blue-l);color:var(--blue);font-weight:700}
/* ── Case picker ── */
.case-picker-row{display:flex;align-items:center;gap:12px;padding:11px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .1s}
.case-picker-row:hover,.case-picker-row.picked{background:var(--blue-l)}
/* ── Sortable ── */
th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
th.sortable:hover{background:#eef2f7}
.sort-arrow{margin-left:4px;font-size:10px;color:var(--blue);font-weight:900}
/* ── Attachments ── */
.att-chip{background:var(--blue-l);color:var(--blue);border-radius:20px;padding:2px 9px;font-size:10px;font-weight:700;cursor:pointer;margin-left:6px;vertical-align:middle;border:none;display:inline-block}
.att-chip:hover{background:#dbeafe}
.att-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:7px;background:var(--surface);transition:all .12s}
.att-item:hover{background:#f8fafc;border-color:#93c5fd;box-shadow:var(--sh-sm)}
.drop-zone{border:2px dashed var(--border);border-radius:var(--r);padding:30px 20px;text-align:center;cursor:pointer;transition:all .15s;margin-top:14px}
.drop-zone:hover,.drop-zone.dz-over{border-color:var(--blue);background:var(--blue-l)}
/* ── Field errors ── */
.field-error{color:var(--red);font-size:11px;margin-top:4px;display:none}
.field-error.visible{display:block}
.upload-progress{background:var(--blue-l);border-radius:var(--r);padding:9px 14px;font-size:12px;color:var(--blue);margin-top:10px;display:none;font-weight:500}
.upload-progress.visible{display:block}
/* ── Move modal ── */
.move-suite-card{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;border-bottom:1px solid #f0f0f0;transition:background .12s}
.move-suite-card:last-child{border-bottom:none}
.move-suite-card:hover{background:#f8fafc}
.move-suite-card input[type=radio]{width:16px;height:16px;accent-color:var(--blue);cursor:pointer;flex-shrink:0}
.move-suite-card.selected{background:var(--blue-l)}
/* ── Cards ── */
.run-card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);padding:20px;cursor:pointer;transition:box-shadow .18s,transform .18s;box-shadow:var(--sh-sm)}
.run-card:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.plan-card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);padding:20px;box-shadow:var(--sh-sm);transition:box-shadow .15s}
.plan-card:hover{box-shadow:var(--sh)}
.stat-card{background:var(--surface);border-radius:var(--r-lg);padding:22px 28px;border:1px solid var(--border);box-shadow:var(--sh-sm);min-width:110px;text-align:center;transition:box-shadow .15s,transform .15s}
.stat-card:hover{box-shadow:var(--sh);transform:translateY(-2px)}
/* ── Toast ── */
#toast{position:fixed;bottom:28px;right:28px;z-index:9999;border-radius:var(--r);padding:12px 22px;font-weight:600;font-size:13px;box-shadow:var(--sh-lg);max-width:380px}
/* ── Global search ── */
#global-search-input{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#e2e8f0;border-radius:var(--r);padding:7px 14px;font-size:13px;outline:none;transition:all .2s;width:240px}
#global-search-input::placeholder{color:rgba(255,255,255,.28)}
#global-search-input:focus{border-color:#60c9f8;background:rgba(255,255,255,.11);box-shadow:0 0 0 3px rgba(96,201,248,.15)}
/* ── Dirty banner ── */
#dirty-banner{background:#fffbeb;border-bottom:2px solid #fcd34d;padding:9px 28px;font-size:12.5px;color:#78350f}
/* ── Scrollbars ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">🧪 TestTrack</div>
    <div style="flex:1"></div>
    <div style="position:relative" id="global-search-wrap">
      <input id="global-search-input" placeholder="🔍 Search all cases…" oninput="globalSearch(this.value)" onfocus="if(this.value)globalSearch(this.value)"/>
      <div id="global-search-results" style="display:none;position:absolute;top:42px;right:0;background:#fff;border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh-lg);min-width:420px;max-height:340px;overflow-y:auto;z-index:500"></div>
    </div>
    <button id="save-btn" class="idle" onclick="saveNow()" title="Save all changes to Google Sheets">
      <span id="save-icon">💾</span>
      <span id="save-label">Saved</span>
    </button>
  </div>
  <div id="dirty-banner" style="display:none;align-items:center;gap:10px">
    ⚠️ <b>You have unsaved changes.</b> Click <b>💾 Save to Sheets</b> before refreshing.
    <button onclick="saveNow()" style="background:var(--amber);color:#fff;border:none;border-radius:4px;padding:3px 10px;font-weight:700;cursor:pointer;font-size:12px">Save now</button>
  </div>
  <div class="tabs" id="tab-bar">
    <button class="tab active" onclick="switchTab('suites')">📁 Suites &amp; Cases</button>
    <button class="tab" onclick="switchTab('runs')">🚀 Test Runs <span id="runs-badge" style="display:none;background:var(--blue);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px"></span></button>
    <button class="tab" onclick="switchTab('plans')">📋 Test Plans</button>
    <button class="tab" onclick="switchTab('overview')">📊 Overview</button>
  </div>
  <div id="loading" style="display:flex;align-items:center;justify-content:center;height:calc(100vh - var(--topbar) - var(--tabbar));flex-direction:column;gap:16px">
    <div class="spinner"></div><span style="color:var(--text2);font-size:14px;font-weight:500">Loading data…</span>
  </div>
  <div id="tab-suites" style="display:none;flex:1">
    <div style="display:flex;height:calc(100vh - var(--topbar) - var(--tabbar))">
      <div class="sidebar">
        <div style="padding:0 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);margin-bottom:8px">
          <span style="font-weight:700;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.6px">Test Suites</span>
          <button class="btn btn-primary" style="padding:4px 10px;font-size:11px" onclick="openSuiteModal()">+ Suite</button>
        </div>
        <div id="suite-list"></div>
      </div>
      <div class="main" id="cases-main"><div style="color:var(--text3);text-align:center;margin-top:80px;font-size:14px">← Select a suite to get started</div></div>
      <div id="detail-panel" style="display:none;width:320px;background:var(--surface);border-left:1px solid var(--border);padding:20px;overflow-y:auto;flex-shrink:0"></div>
    </div>
  </div>
  <div id="tab-runs" style="display:none;padding:28px">
    <div id="runs-list-view"></div>
    <div id="run-detail-view" style="display:none"></div>
  </div>
  <div id="tab-plans" style="display:none;padding:28px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="color:var(--navy);font-size:20px;font-weight:700">📋 Test Plans</h2>
      <button class="btn btn-primary" onclick="openPlanModal()">+ New Plan</button>
    </div>
    <div id="plans-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px"></div>
  </div>
  <div id="tab-overview" style="display:none;padding:28px">
    <h2 style="color:var(--navy);margin-bottom:24px;font-size:20px;font-weight:700">📊 Project Overview</h2>
    <div id="overview-stats" style="display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap"></div>
    <div id="overview-suites" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px"></div>
  </div>
</div>
<div id="toast" style="display:none"></div>
<div id="modal-bg" class="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div id="modal-content" class="modal"></div>
</div>
<div id="bulk-bar" class="bulk-bar" style="display:none">
  <span id="bulk-count" style="font-size:13px;font-weight:700;color:#4fc3f7;white-space:nowrap"></span>
  <div style="width:1px;height:20px;background:rgba(255,255,255,.2)"></div>
  <select onchange="if(this.value){bulkStatus(this.value);this.value=''}" style="background:#253347;color:#fff;border:1px solid #4a5568;border-radius:5px;padding:5px 10px;font-size:12px">
    <option value="">Change Status…</option>
    <option>Untested</option><option>Passed</option><option>Failed</option><option>Blocked</option><option>Retest</option>
  </select>
  <button onclick="openBulkMoveModal()" style="background:#fff3e0;color:#e67e22;border:1px solid #e67e22;border-radius:5px;padding:6px 12px;font-size:12px;font-weight:600;white-space:nowrap">📦 Move</button>
  <button onclick="openRunModalWithSelection()" class="btn btn-primary" style="white-space:nowrap">🚀 Add to Run</button>
  <button onclick="bulkDelete()" style="background:#c0392b;color:#fff;border:none;border-radius:5px;padding:6px 12px;font-size:12px;font-weight:600">🗑️ Delete</button>
  <button onclick="clearSelection()" style="background:none;color:#adb5bd;border:1px solid #4a5568;border-radius:5px;padding:6px 12px;font-size:12px">✕ Clear</button>
</div>
<input type="file" id="import-input" accept=".csv" style="display:none" onchange="handleImport(event)"/>
<input type="file" id="attachment-input" multiple style="display:none" onchange="handleAttachmentUpload(event)"/>
<datalist id="assignees-list"></datalist>

<script>
// ══════════════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════════════
const IS_GAS    = (typeof google !== 'undefined');
const STORE_KEY = 'tt_v3';

const DEFAULT_DB = {
  suites:[
    {id:1,name:'Authentication Suite',description:'Login, logout, password reset',cases:[
      {id:101,suiteId:1,title:'Valid login with email/password',type:'Functional',priority:'Critical',status:'Passed',assignedTo:'Ana M.',automationStatus:'Automated',steps:'1. Navigate to /login\n2. Enter valid credentials\n3. Click Sign In',expected:'User is redirected to dashboard',attachments:[]},
      {id:102,suiteId:1,title:'Login with invalid password',type:'Functional',priority:'High',status:'Failed',assignedTo:'Ion P.',automationStatus:'Automated',steps:'1. Navigate to /login\n2. Enter wrong password',expected:'Error message is shown',attachments:[]},
      {id:103,suiteId:1,title:'Password reset flow',type:'Functional',priority:'Medium',status:'Untested',assignedTo:'',automationStatus:'Manual',steps:'1. Click Forgot Password\n2. Enter email',expected:'Reset email received',attachments:[]}
    ]},
    {id:2,name:'Dashboard Suite',description:'Dashboard widgets and navigation',cases:[
      {id:201,suiteId:2,title:'Dashboard loads within 3s',type:'Performance',priority:'High',status:'Untested',assignedTo:'Ana M.',automationStatus:'Planned',steps:'1. Login\n2. Measure load time',expected:'Page loads in < 3 seconds',attachments:[]},
      {id:202,suiteId:2,title:'Sidebar navigation links',type:'UI',priority:'Medium',status:'Passed',assignedTo:'',automationStatus:'Manual',steps:'1. Click each sidebar item',expected:'Correct page opens',attachments:[]}
    ]}
  ],
  plans:[{id:10,name:'Sprint 12 Regression',description:'Full regression',createdAt:'2026-03-01',selectedSuites:[1,2]}],
  runs:[{id:20,name:'Smoke Test – Build 42',description:'',createdAt:'2026-03-11',suiteId:1,suiteName:'Authentication Suite',cases:[
    {id:501,originalId:101,title:'Valid login with email/password',type:'Functional',priority:'Critical',status:'Passed',assignedTo:'Ana M.',automationStatus:'Automated',steps:'1. Navigate\n2. Enter creds',expected:'User redirected'},
    {id:502,originalId:102,title:'Login with invalid password',type:'Functional',priority:'High',status:'Untested',assignedTo:'Ion P.',automationStatus:'Automated',steps:'1. Navigate\n2. Wrong password',expected:'Error shown'}
  ]}]
};

const _files = {};

// ══════════════════════════════════════════════════════════
//  GAS MOCK
// ══════════════════════════════════════════════════════════
if(!IS_GAS){
  window._db = null;
  window.google = {script:{run:{
    _sh:null,_fh:null,
    withSuccessHandler(fn){const o=Object.create(this);o._sh=fn;return o;},
    withFailureHandler(fn){const o=Object.create(this);o._fh=fn;return o;},
    getSuites(){const sh=this._sh;setTimeout(()=>sh&&sh(JSON.stringify(window._db.suites)),60);},
    getPlans(){ const sh=this._sh;setTimeout(()=>sh&&sh(JSON.stringify(window._db.plans)), 60);},
    getRuns(){  const sh=this._sh;setTimeout(()=>sh&&sh(JSON.stringify(window._db.runs)),  60);},
    saveAll(sj,pj,rj){
      window._db.suites=JSON.parse(sj);window._db.plans=JSON.parse(pj);window._db.runs=JSON.parse(rj);
      const sh=this._sh;setTimeout(()=>sh&&sh(true),60);
    },
    uploadAttachment(b64,name,mime){
      const id='mock-'+Date.now()+'-'+Math.random().toString(36).slice(2);
      const dataUrl='data:'+mime+';base64,'+b64;
      _files[id]=dataUrl;
      try{window.storage.set('att_'+id,dataUrl).catch(()=>{});}catch(e){}
      const sh=this._sh;setTimeout(()=>sh&&sh({fileId:id,viewUrl:null,fileName:name}),60);
    },
    deleteAttachment(id){
      delete _files[id];
      try{window.storage.delete('att_'+id).catch(()=>{});}catch(e){}
      const sh=this._sh;setTimeout(()=>sh&&sh(true),60);
    }
  }}};
}

async function storageLoad(){
  let data;
  try{
    const r=await window.storage.get(STORE_KEY);
    if(r&&r.value){
      const d=JSON.parse(r.value);
      data={suites:Array.isArray(d.suites)?d.suites:DEFAULT_DB.suites,plans:Array.isArray(d.plans)?d.plans:DEFAULT_DB.plans,runs:Array.isArray(d.runs)?d.runs:DEFAULT_DB.runs};
    }else{data=JSON.parse(JSON.stringify(DEFAULT_DB));}
  }catch(e){data=JSON.parse(JSON.stringify(DEFAULT_DB));}
  try{
    const attKeys=await window.storage.list('att_');
    if(attKeys&&attKeys.keys){for(const k of attKeys.keys){try{const ar=await window.storage.get(k);if(ar&&ar.value)_files[k.slice(4)]=ar.value;}catch(e2){}}}
  }catch(e){}
  return data;
}

function freshId(){
  const used=new Set([
    ...suites.flatMap(s=>[Number(s.id),...s.cases.map(c=>Number(c.id))]),
    ...plans.map(p=>Number(p.id)),
    ...runs.flatMap(r=>[Number(r.id),...(r.cases||[]).map(c=>Number(c.id))])
  ]);
  while(used.has(nextId)) nextId++;
  return nextId++;
}

function markDirty(){
  isDirty=true;
  const btn=document.getElementById('save-btn');
  btn.className='dirty';
  document.getElementById('save-icon').textContent='💾';
  document.getElementById('save-label').textContent='Save to Sheets';
  document.getElementById('dirty-banner').style.display='flex';
}
function markSaved(){
  isDirty=false;
  const btn=document.getElementById('save-btn');
  btn.className='saved';
  document.getElementById('save-icon').textContent='✓';
  document.getElementById('save-label').textContent='Saved';
  document.getElementById('dirty-banner').style.display='none';
  setTimeout(()=>{if(!isDirty){btn.className='idle';document.getElementById('save-icon').textContent='💾';document.getElementById('save-label').textContent='Saved';}},2500);
}
function markSaving(){
  const btn=document.getElementById('save-btn');
  btn.className='saving';

  document.getElementById('save-label').textContent='Saving…';
}
function markSaveError(msg){

  document.getElementById('save-label').textContent='Failed – retry';

    btn.className='saving';

// ══════════════════════════════════════════════════════════
//  SAVE
// ══════════════════════════════════════════════════════════
function saveNow(){
  if(isSaving)return;
  if(uploadsInProgress>0){toast('⏳ Upload in progress, please wait…','info');return;}
  if(!isDirty){toast('✓ Already saved','info');return;}
  isSaving=true; markSaving();
  const sj=JSON.stringify(suites),pj=JSON.stringify(plans),rj=JSON.stringify(runs);
  if(!IS_GAS){
    (async()=>{
      try{
        const clean=JSON.parse(JSON.stringify({suites,plans,runs}));
        for(const suite of clean.suites)for(const c of(suite.cases||[]))for(const att of(c.attachments||[])){
          if(att.viewUrl&&att.viewUrl.startsWith('data:')){
            if(!_files[att.fileId]){_files[att.fileId]=att.viewUrl;window.storage.set('att_'+att.fileId,att.viewUrl).catch(()=>{});}
            att.viewUrl=null;
          }
        }
        const r=await window.storage.set(STORE_KEY,JSON.stringify(clean));
        if(!r)throw new Error('storage.set returned null');
        window._db.suites=JSON.parse(sj);window._db.plans=JSON.parse(pj);window._db.runs=JSON.parse(rj);
        isSaving=false;markSaved();toast('✅ Saved!');
      }catch(e){markSaveError(e.message);}
    })();
    return;
  }
  google.script.run
    .withSuccessHandler(()=>{isSaving=false;markSaved();toast('✅ Saved to Google Sheets!');})
    .withFailureHandler(e=>markSaveError(e.message||JSON.stringify(e)))
    .saveAll(sj,pj,rj);
}

// Wraps a GAS call as a Promise so all three data fetches run in parallel
function _gasPromise(fn){return new Promise(function(resolve,reject){google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn]();});}
window.onload = async function(){
  if(!IS_GAS) window._db = await storageLoad();
  try{
    const [sj,pj,rj]=await Promise.all([_gasPromise('getSuites'),_gasPromise('getPlans'),_gasPromise('getRuns')]);
    suites=JSON.parse(sj);plans=JSON.parse(pj);runs=JSON.parse(rj);
    const ids=[
      ...suites.flatMap(s=>[Number(s.id),...s.cases.map(c=>Number(c.id))]),
      ...plans.map(p=>Number(p.id)),
      ...runs.flatMap(r=>[Number(r.id),...(r.cases||[]).map(c=>Number(c.id))])
    ];
    if(ids.length) nextId=Math.max(nextId,...ids)+1;
    document.getElementById('loading').style.display='none';
    switchTab('suites');
    if(suites.length){selSuiteId=suites[0].id;renderAll();}
    updateRunsBadge();markSaved();
  }catch(e){document.getElementById('loading').style.display='none';toast('❌ '+(e.message||e),'error');}
};

function sTh(label,field){
  const a=sortField===field,arrow=a?(sortDir==='asc'?'▲':'▼'):'';
  return`<th class="sortable" onclick="toggleSort('${field}')">${label}${a?`<span class="sort-arrow">${arrow}</span>`:''}</th>`;
}
function toggleSort(field){if(sortField===field)sortDir=sortDir==='asc'?'desc':'asc';else{sortField=field;sortDir='asc';}renderCases();}
function sortCasesArr(arr){
  return[...arr].sort((a,b)=>{
    let va,vb;
    if(sortField==='priority'){va=PRIORITY_ORDER[a.priority]??99;vb=PRIORITY_ORDER[b.priority]??99;}
    else if(sortField==='status'){va=STATUS_ORDER[a.status]??99;vb=STATUS_ORDER[b.status]??99;}
    else{va=a[sortField]??'';vb=b[sortField]??'';}
    if(typeof va==='number'&&typeof vb==='number')return sortDir==='asc'?va-vb:vb-va;
    const c=String(va).localeCompare(String(vb));return sortDir==='asc'?c:-c;
  });
}

function moveCaseToSuite(caseId, targetSuiteId){
  if(!targetSuiteId){toast('Please select a destination suite.','info');return;}
  const srcSuite=suites.find(s=>s.id===selSuiteId);
  const dstSuite=suites.find(s=>s.id===targetSuiteId);
  if(!srcSuite||!dstSuite)return;
  const idx=srcSuite.cases.findIndex(c=>c.id===caseId);
  if(idx===-1)return;
  const[c]=srcSuite.cases.splice(idx,1);
  c.suiteId=targetSuiteId;
  dstSuite.cases.push(c);
  if(selCaseId===caseId){selCaseId=null;document.getElementById('detail-panel').style.display='none';}
  selIds.delete(caseId);
  closeModal();
  markDirty();
  renderAll();
  toast(`✅ Moved "${c.title}" → ${dstSuite.name}`);
}

    </div>`);
  document.getElementById('modal-content').querySelectorAll('[name=bulk-move-target]').forEach(r=>{
    r.addEventListener('change',()=>{
      document.getElementById('modal-content').querySelectorAll('.move-suite-card').forEach(el=>el.classList.remove('selected'));
      r.closest('.move-suite-card').classList.add('selected');
    });
  });
}

function bulkMove(targetSuiteId){
  if(!targetSuiteId){toast('Please select a destination suite.','info');return;}
  const srcSuite=suites.find(s=>s.id===selSuiteId);
  const dstSuite=suites.find(s=>s.id===targetSuiteId);
  if(!srcSuite||!dstSuite)return;
  const count=selIds.size;
  for(const id of selIds){
    const idx=srcSuite.cases.findIndex(c=>c.id===id);
    if(idx!==-1){
      const[c]=srcSuite.cases.splice(idx,1);
      c.suiteId=targetSuiteId;
      dstSuite.cases.push(c);
    }
  }
  selIds=new Set();
  selCaseId=null;
  document.getElementById('detail-panel').style.display='none';
  closeModal();
  markDirty();
  renderAll();
  toast(`✅ Moved ${count} case${count!==1?'s':''} → ${dstSuite.name}`);
}

function selectSuite(id){selSuiteId=id;selCaseId=null;selIds=new Set();renderAll();document.getElementById('detail-panel').style.display='none';updateBulkBar();}
function selectCase(id){selCaseId=id;renderDetailPanel();renderCases();}
function updateStatus(caseId,status){const suite=suites.find(s=>s.id===selSuiteId);if(!suite)return;const c=suite.cases.find(c=>c.id===caseId);if(c){c.status=status;markDirty();renderDetailPanel();}}
function updateRunCaseStatus(runId,caseId,status){const run=runs.find(r=>r.id===runId);if(!run)return;const c=run.cases.find(c=>c.id===caseId);if(c){c.status=status;markDirty();renderRunDetail();}}
function deleteSuite(id){if(!confirm('Delete suite and all its cases?'))return;suites=suites.filter(s=>s.id!==id);if(selSuiteId===id)selSuiteId=suites[0]?.id||null;markDirty();renderAll();}
function deleteCase(id){
  const suite=suites.find(s=>s.id===selSuiteId);if(!suite)return;
  const idx=suite.cases.findIndex(c=>c.id===id);
  if(idx===-1)return;
  suite.cases.splice(idx,1);
  if(selCaseId===id){selCaseId=null;document.getElementById('detail-panel').style.display='none';}
  selIds.delete(id);
  markDirty();renderCases();renderSidebar();
}
function deleteRun(id){if(!confirm('Delete this test run?'))return;runs=runs.filter(r=>r.id!==id);if(activeRunId===id){activeRunId=null;renderRunsList();}else renderRunsList();markDirty();updateRunsBadge();}
function duplicateCase(id){
  const suite=suites.find(s=>s.id===selSuiteId);if(!suite)return;
  const c=suite.cases.find(x=>x.id===id);if(!c)return;
  const newTitle=uniqueCopyName(suite.cases.map(x=>x.title),'Copy of '+c.title);
  suite.cases.push({...c,id:freshId(),title:newTitle,attachments:[]});
  markDirty();renderCases();renderSidebar();toast(`✅ Case duplicated as "${newTitle}"`);
}
function duplicateRun(id){
  const run=runs.find(r=>r.id===id);if(!run)return;
  const newName=uniqueCopyName(runs.map(r=>r.name),'Copy of '+run.name);
  runs.push({...run,id:freshId(),name:newName,createdAt:new Date().toISOString().slice(0,10),cases:run.cases.map(c=>({...c,id:freshId(),status:'Untested'}))});
  markDirty();renderRunsList();updateRunsBadge();toast(`✅ Run duplicated as "${newName}"`);
}
function uniqueCopyName(existing,base){
  const low=existing.map(n=>n.toLowerCase());
  if(!low.includes(base.toLowerCase()))return base;
  let i=2;while(low.includes((base+' ('+i+')').toLowerCase()))i++;return base+' ('+i+')';
}
function toggleCase(id){selIds.has(id)?selIds.delete(id):selIds.add(id);renderCases();}

function bulkDelete(){

function renderAttachmentsHtml(caseId,c){
  const atts=c.attachments||[];
  if(!atts.length)return'<div style="text-align:center;padding:16px 0;color:#bbb;font-size:12px">No files attached yet.</div>';
  return atts.map(att=>`
    <div class="att-item">
      <span style="font-size:22px;flex-shrink:0">${getFileIcon(att.type)}</span>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1e2a3a">${esc(att.name)}</div>
        <div style="font-size:11px;color:#888;margin-top:1px">${formatFileSize(att.size)} · ${att.uploadedAt}</div>
      </div>
      <button onclick="viewAttachment(${caseId},${att.id})" style="background:#e8f0fe;color:#1a73e8;border:none;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600">↗ View</button>
      <button onclick="removeAttachment(${caseId},${att.id})" style="background:#fdecea;color:#c0392b;border:none;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:13px">🗑</button>
    </div>`).join('');
}
function handleAttachmentUpload(e){processAttachmentFiles(attachmentTargetCaseId,[...e.target.files]);e.target.value='';}
function handleAttachmentDrop(e){e.preventDefault();e.currentTarget.classList.remove('dz-over');processAttachmentFiles(attachmentTargetCaseId,[...e.dataTransfer.files]);}
function processAttachmentFiles(caseId,files){
  console.log('[TT] processAttachmentFiles caseId='+caseId+' files='+files.length);
  if(!files.length||caseId==null){console.warn('[TT] aborted: no files or caseId null');return;}
  const found=findCaseById(caseId);
  if(!found){console.warn('[TT] aborted: case not found for id='+caseId);return;}
  const{c}=found;if(!c.attachments)c.attachments=[];
  const prog=document.getElementById('att-upload-progress');if(prog)prog.classList.add('visible');
  uploadsInProgress+=files.length;
  _updateSaveBtnForUpload();
  let pending=files.length;
  files.forEach(file=>{
    console.log('[TT] reading file: '+file.name+' size='+file.size+' type='+file.type);
    const reader=new FileReader();
    reader.onload=ev=>{
      const b64=ev.target.result.split(',')[1];
      console.log('[TT] base64 ready, length='+b64.length+', calling GAS uploadAttachment');
      google.script.run
        .withSuccessHandler(function(r){
          console.log('[TT] uploadAttachment success, r='+JSON.stringify(r));
          if(!r||!r.fileId){console.error('[TT] bad response from GAS:',r);toast('❌ Upload error: invalid server response','error');uploadsInProgress--;if(--pending===0)_finishUpload(caseId,c,files.length);return;}
          c.attachments.push({id:freshId(),name:file.name,type:file.type||'application/octet-stream',size:file.size,fileId:r.fileId,viewUrl:r.viewUrl,uploadedAt:new Date().toISOString().slice(0,10)});
          uploadsInProgress--;
          if(--pending===0)_finishUpload(caseId,c,files.length);
        })
        .withFailureHandler(function(e){
          console.error('[TT] uploadAttachment FAILED:',e);
          uploadsInProgress--;
          const msg=e&&e.message?e.message:(typeof e==='string'?e:'Unknown error – check Drive permissions');
          toast('❌ Upload failed: '+msg,'error');
          if(--pending===0)_finishUpload(caseId,c,files.length);
        })
        .uploadAttachment(b64,file.name,file.type||'application/octet-stream');
    };
    reader.onerror=function(e){
      console.error('[TT] FileReader error:',e);
      uploadsInProgress--;
      toast('❌ Could not read file: '+file.name,'error');
      if(--pending===0)_finishUpload(caseId,c,files.length);
    };
    reader.readAsDataURL(file);
  });
}
function _finishUpload(caseId,c,count){
  console.log('[TT] _finishUpload caseId='+caseId+' count='+count+' attachments='+JSON.stringify(c.attachments));
  const prog=document.getElementById('att-upload-progress');if(prog)prog.classList.remove('visible');
  markDirty();                   // must come BEFORE _updateSaveBtnForUpload
  _updateSaveBtnForUpload();
  const list=document.getElementById('att-list');if(list)list.innerHTML=renderAttachmentsHtml(caseId,c);
  renderDetailPanel();
  renderCases();
  toast(`📎 ${count} file${count>1?'s':''} uploaded — saving…`,'info');
  saveNow();
}
function removeAttachment(caseId,attId){
  const found=findCaseById(caseId);if(!found)return;
  const{c}=found;
  const att=(c.attachments||[]).find(a=>a.id===attId);
  if(att?.fileId)google.script.run.deleteAttachment(att.fileId);
  c.attachments=(c.attachments||[]).filter(a=>a.id!==attId);
  markDirty();
  const list=document.getElementById('att-list');if(list)list.innerHTML=renderAttachmentsHtml(caseId,c);
  renderDetailPanel();toast('Attachment removed.','info');
}
function viewAttachment(caseId,attId){
  const found=findCaseById(caseId);if(!found)return;
  const att=(found.c.attachments||[]).find(a=>a.id===attId);if(!att)return;
  let url=att.viewUrl;
  if(!url&&att.fileId&&_files[att.fileId])url=_files[att.fileId];
  if(url){
    if(url.startsWith('data:')&&att.type.startsWith('image/')){
      const w=window.open('','_blank');
      w.document.write(`<html><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${url}" style="max-width:100%;max-height:100vh;object-fit:contain"/></body></html>`);
      w.document.close();
    }else if(url.startsWith('data:')){
      const a=document.createElement('a');a.href=url;a.download=att.name;a.click();
    }else window.open(url,'_blank');
    return;
  }
  toast('⚠️ No preview available.','info');
}
function findCaseById(id){for(const s of suites){const c=s.cases.find(x=>x.id===id);if(c)return{suite:s,c};}return null;}
function getFileIcon(m){if(!m)return'📄';if(m.startsWith('image/'))return'🖼️';if(m==='application/pdf')return'📕';if(m.includes('spreadsheet')||m.includes('excel')||m.includes('csv'))return'📊';if(m.includes('word')||m.includes('document'))return'📝';if(m.includes('zip')||m.includes('compress')||m.includes('archive'))return'🗜️';if(m.startsWith('video/'))return'🎬';if(m.startsWith('audio/'))return'🎵';if(m.includes('text/'))return'📃';return'📄';}
function formatFileSize(b){if(!b)return'0 B';if(b<1024)return b+' B';if(b<1048576)return(b/1024).toFixed(1)+' KB';return(b/1048576).toFixed(1)+' MB';}

// ══════════════════════════════════════════════════════════
//  CSV
// ══════════════════════════════════════════════════════════
function exportCsv(){const suite=suites.find(s=>s.id===selSuiteId);if(!suite)return;const h=['id','title','type','priority','status','assignedTo','automationStatus','steps','expected'];const rows=[h.join(','),...suite.cases.map(c=>h.map(k=>csvEsc(c[k]??'')).join(','))].join('\n');dlFile(suite.name.replace(/\s+/g,'-')+'.csv',rows,'text/csv');toast('Exported '+suite.cases.length+' cases!');}
function exportAll(){const h=['suite','id','title','type','priority','status','assignedTo','automationStatus','steps','expected'];const rows=[h.join(','),...suites.flatMap(s=>s.cases.map(c=>[s.name,...['id','title','type','priority','status','assignedTo','automationStatus','steps','expected'].map(k=>csvEsc(c[k]??''))].join(',')))].join('\n');dlFile('all-cases.csv',rows,'text/csv');toast('Exported all cases!');}
function dlFile(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
function csvEsc(v){const s=String(v).replace(/"/g,'""');return /[",\n\r]/.test(s)?`"${s}"`:s;}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const suite=suites.find(s=>s.id===selSuiteId);if(!suite)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const lines=ev.target.result.trim().split(/\r?\n/);
    const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    const existingTitles=new Set(suite.cases.map(c=>c.title.toLowerCase()));
    let skipped=0;
    const cases=lines.slice(1).map(line=>{
      const vals=[];let cur='',inQ=false;
      for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&!inQ)inQ=true;else if(ch==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;}else if(ch==='"'&&inQ)inQ=false;else if(ch===','&&!inQ){vals.push(cur);cur='';}else cur+=ch;}
      vals.push(cur);const o={};headers.forEach((h,i)=>o[h]=(vals[i]||'').trim());
      if(!o.title)return null;
      if(existingTitles.has(o.title.toLowerCase())){skipped++;return null;}
      existingTitles.add(o.title.toLowerCase());
      return{id:freshId(),suiteId:selSuiteId,title:o.title,type:o.type||'Functional',priority:o.priority||'Medium',status:STATUSES.includes(o.status)?o.status:'Untested',assignedTo:o.assignedTo||'',automationStatus:o.automationStatus||'Manual',steps:o.steps||'',expected:o.expected||'',attachments:[]};
    }).filter(Boolean);
    if(!cases.length){toast(`Import: 0 new cases (${skipped} duplicate${skipped!==1?'s':''} skipped).`,'info');e.target.value='';return;}
    suite.cases.push(...cases);
    markDirty();renderCases();renderSidebar();
    const msg=skipped>0?`Imported ${cases.length} cases (${skipped} duplicates skipped). Click 💾 Save.`:`Imported ${cases.length} cases. Click 💾 Save to Sheets.`;
    toast(msg,'info');
  };
  reader.readAsText(file);e.target.value='';
}

// ══════════════════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════
//  GLOBAL SEARCH
// ══════════════════════════════════════════════════════════
function globalSearch(q){
  const rs=document.getElementById('global-search-results');
  if(!q.trim()){rs.style.display='none';return;}
  const low=q.toLowerCase();
  const results=[];
  suites.forEach(s=>{s.cases.filter(c=>c.title.toLowerCase().includes(low)||(c.steps||'').toLowerCase().includes(low)||(c.expected||'').toLowerCase().includes(low)).forEach(c=>results.push({suite:s,c}));});
  if(!results.length){rs.innerHTML='<div style="padding:16px;text-align:center;color:#aaa;font-size:12px">No results found</div>';rs.style.display='block';return;}
  rs.innerHTML=results.slice(0,20).map(({suite,c})=>`
    <div onclick="globalSearchGo(${suite.id},${c.id})" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0;transition:background .1s" onmouseover="this.style.background='#f0f4ff'" onmouseout="this.style.background=''">
      <div style="font-size:13px;font-weight:600;color:#1e2a3a">${esc(c.title)}</div>
      <div style="font-size:11px;color:#888;margin-top:2px">📁 ${esc(suite.name)} · ${priDot(c.priority)} · <span style="color:${SC[c.status]?.text||'#666'}">${c.status}</span></div>
    </div>`).join('')+(results.length>20?`<div style="padding:8px 14px;font-size:11px;color:#888;text-align:center">+${results.length-20} more results</div>`:'');
  rs.style.display='block';
}
function globalSearchGo(suiteId,caseId){
  document.getElementById('global-search-input').value='';
  document.getElementById('global-search-results').style.display='none';
  switchTab('suites');
  selSuiteId=suiteId;selCaseId=caseId;filterSt='All';searchVal='';
  renderAll();renderDetailPanel();
}
document.addEventListener('click',function(e){
  const wrap=document.getElementById('global-search-wrap');
  if(wrap&&!wrap.contains(e.target))document.getElementById('global-search-results').style.display='none';
});

// ══════════════════════════════════════════════════════════
//  RUN DETAIL SORTING
// ══════════════════════════════════════════════════════════
function runSTh(label,field){
  const a=runSortField===field,arrow=a?(runSortDir==='asc'?'▲':'▼'):'';
  return`<th class="sortable" onclick="toggleRunSort('${field}')">${label}${a?`<span class="sort-arrow">${arrow}</span>`:''}</th>`;
}
function toggleRunSort(field){if(runSortField===field)runSortDir=runSortDir==='asc'?'desc':'asc';else{runSortField=field;runSortDir='asc';}renderRunDetail();}
function sortRunCases(arr){
  if(!runSortField)return arr;
  return[...arr].sort((a,b)=>{
    let va,vb;
    if(runSortField==='priority'){va=PRIORITY_ORDER[a.priority]??99;vb=PRIORITY_ORDER[b.priority]??99;}
    else if(runSortField==='status'){va=STATUS_ORDER[a.status]??99;vb=STATUS_ORDER[b.status]??99;}
    else{va=a[runSortField]??'';vb=b[runSortField]??'';}
    if(typeof va==='number'&&typeof vb==='number')return runSortDir==='asc'?va-vb:vb-va;
    const c=String(va).localeCompare(String(vb));return runSortDir==='asc'?c:-c;
  });
}

// ══════════════════════════════════════════════════════════
//  ADD CASES TO EXISTING RUN
// ══════════════════════════════════════════════════════════
function openAddCasesToRunModal(runId){
  const run=runs.find(r=>r.id===runId);if(!run)return;
  const suite=suites.find(s=>s.id===run.suiteId);
  if(!suite){toast('Source suite no longer exists.','info');return;}
  const existingOrigIds=new Set(run.cases.map(c=>c.originalId));
  const available=suite.cases.filter(c=>!existingOrigIds.has(c.id));
  if(!available.length){toast('All cases from this suite are already in the run.','info');return;}
  openModal(`<h3 style="margin:0 0 16px;color:#1e2a3a">+ Add Cases to Run</h3>
    <div style="font-size:12px;color:#888;margin-bottom:14px;padding:8px 12px;background:#f8f9fa;border-radius:6px"><b style="color:#1e2a3a">🚀 ${esc(run.name)}</b> · from 📁 ${esc(suite.name)}</div>
    <div style="border:1px solid #dde1e7;border-radius:8px;overflow:hidden;max-height:320px;overflow-y:auto">
      <div style="background:#f8f9fa;padding:8px 14px;border-bottom:1px solid #dde1e7;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;font-weight:700">Available cases (${available.length})</span>
        <div style="display:flex;gap:10px">
          <button onclick="document.querySelectorAll('.add-run-cb').forEach(cb=>cb.checked=true)" style="background:none;border:none;cursor:pointer;font-size:11px;color:#1a73e8;font-weight:600">Select All</button>
          <button onclick="document.querySelectorAll('.add-run-cb').forEach(cb=>cb.checked=false)" style="background:none;border:none;cursor:pointer;font-size:11px;color:#888">Clear</button>
        </div>
      </div>
      ${available.map(c=>`<label class="case-picker-row"><input type="checkbox" value="${c.id}" class="add-run-cb" style="cursor:pointer;width:16px;height:16px"/><div style="flex:1;min-width:0"><div style="font-size:13px;color:#1e2a3a">${esc(c.title)}</div><div style="font-size:10px;color:${PC[c.priority]||'#888'};font-weight:600;margin-top:2px">${c.priority} · ${c.type}</div></div><span class="badge" style="background:${SC[c.status]?.bg||'#f1f3f5'};color:${SC[c.status]?.text||'#555'};border:1px solid ${SC[c.status]?.border||'#dde1e7'};font-size:10px">${c.status}</span></label>`).join('')}
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addCasesToRun(${runId})">+ Add Selected</button>
    </div>`);
}
function addCasesToRun(runId){
  const run=runs.find(r=>r.id===runId);if(!run)return;
  const suite=suites.find(s=>s.id===run.suiteId);if(!suite)return;
  const pickedIds=new Set([...document.querySelectorAll('.add-run-cb:checked')].map(el=>Number(el.value)));
  if(!pickedIds.size){toast('No cases selected.','info');return;}
  const toAdd=suite.cases.filter(c=>pickedIds.has(c.id));
  toAdd.forEach(c=>run.cases.push({...c,id:freshId(),originalId:c.id,status:'Untested'}));
  closeModal();markDirty();renderRunDetail();
  toast(`✅ Added ${toAdd.length} case${toAdd.length!==1?'s':''} to run.`);
}

// ══════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════
function _refreshAssigneeList(){
  const names=[...new Set(suites.flatMap(s=>s.cases.map(c=>c.assignedTo)).filter(Boolean))].sort();
  const dl=document.getElementById('assignees-list');
  if(dl)dl.innerHTML=names.map(n=>`<option value="${esc(n)}">`).join('');
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function priDot(p){return`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:${PC[p]||'#888'}"><span style="width:8px;height:8px;border-radius:50%;background:${PC[p]||'#888'};display:inline-block"></span>${p}</span>`;}
function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  t.style.background=type==='error'?'var(--red-l)':type==='info'?'#fefce8':'var(--green-l)';
  t.style.color=type==='error'?'var(--red)':type==='info'?'#78350f':'var(--green)';
  t.style.border=`1px solid ${type==='error'?'#fca5a5':type==='info'?'#fde68a':'#86efac'}`;
  setTimeout(()=>t.style.display='none',4000);
}
